<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>datey - A special request</title>
  
  <!-- Fonts matching the design: Caveat for handwriting, Nunito for clean UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #f45b69; /* The signature pink/coral color from the image */
      --bg-color: #fdfaf9; /* Very light pinkish off-white */
      --text-main: #3a2b2e;
      --text-muted: #8e8082;
      --btn-secondary: #f5ecec;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8dada; /* Darker background so the "phone" stands out */
      padding: 20px;
      overflow-x: hidden;
    }

    /* Mobile App Container mimicking the phone screen */
    .app-container {
      background: var(--bg-color);
      width: 100%;
      max-width: 390px; /* iPhone Pro width */
      min-height: 800px;
      border-radius: 40px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.15);
      position: relative;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 8px solid #ffffff;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .logo {
      color: var(--primary);
      font-weight: 800;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-dots {
      color: var(--text-muted);
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* Hero Images */
    .hero-img {
      width: 100%;
      max-width: 220px;
      margin: 0 auto 30px;
      display: block;
    }

    /* Typography */
    h1.handwritten {
      font-family: 'Caveat', cursive;
      font-size: 46px;
      color: var(--text-main);
      text-align: center;
      line-height: 1.1;
      margin-bottom: 40px;
    }

    h1.handwritten .heart {
      color: var(--primary);
      font-size: 36px;
    }

    .success-subtitle {
      font-family: 'Nunito', sans-serif;
      text-align: center;
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 600;
      margin-top: -30px;
      margin-bottom: 30px;
    }

    /* Buttons */
    .btn-group {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 10;
    }

    .btn {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 8px 20px rgba(244, 91, 105, 0.25);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: var(--btn-secondary);
      color: var(--text-main);
    }

    /* Date Details Card */
    #details-view {
      display: none;
      animation: fadeIn 0.6s ease-out;
      height: 100%;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .date-card {
      background: white;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    .date-card-img {
      width: 100%;
      height: 150px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 16px;
    }

    .date-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .date-desc {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-weight: 600;
    }

    .date-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .date-row:last-child {
      margin-bottom: 8px;
    }

    .icon-svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-top: 2px;
    }

    .row-text {
      font-size: 15px;
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.4;
    }

    .row-subtext {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Hide default link styling for the RSVP button */
    a.btn {
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Shared Header -->
    <div class="header">
      <div class="logo">❤️ datey</div>
      <div class="header-dots">•••</div>
    </div>

    <!-- VIEW 1: THE QUESTION -->
    <div id="ask-view" style="display: flex; flex-direction: column; height: 100%;">
      
      <!-- Placeholder for the bear image -->
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdW4ycGNocDdwZDRwMGs1eTlyeW01NGtyMmI5cTZoNnM3Z21xMDlyNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L4lvBzeGQwpvy8eUC4/giphy.gif" alt="Cute Bear" class="hero-img" style="border-radius: 20px;" />
      
      <h1 class="handwritten">Will you go <br>on a date <br>with me?<span class="heart">♡</span></h1>

      <div class="btn-group">
        <button id="yesBtn" class="btn btn-primary" onclick="handleYes()">Yes! ♡</button>
        <button id="noBtn" class="btn btn-secondary" onmouseover="moveButton()" onclick="moveButton()">No ☹</button>
      </div>
    </div>


    <!-- VIEW 2: THE REVEAL -->
    <div id="details-view">
      
      <h1 class="handwritten" style="color: var(--primary); font-size: 56px; margin-bottom: 10px;">Yay!</h1>
      <p class="success-subtitle">You said yes! ♡</p>

      <div class="date-card">
        <!-- Image of the restaurant/location -->
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Restaurant interior" class="date-card-img" />
        
        <div class="date-title">Dinner at Luna Café</div>
        <div class="date-desc">Good food, better company ♡</div>

        <div class="date-row">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <div class="row-text">
            Sat, Apr 26, 2025
            <span class="row-subtext">7:00 PM - 9:00 PM</span>
          </div>
        </div>

        <div class="date-row">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <div class="row-text">
            Luna Café
            <span class="row-subtext">123 Maple Ave, San Francisco, CA</span>
          </div>
        </div>
      </div>

      <!-- Action Button at the bottom -->
      <div style="margin-top: auto;">
        <a href="sms:?&body=Hey!%20I%20said%20YES%20to%20our%20date!%20%E2%9C%A8" class="btn btn-primary">
          <svg class="icon-svg" style="stroke: white; width: 18px; height: 18px; margin-top: 0;" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Add to Calendar
        </a>
      </div>

    </div>

  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const appContainer = document.querySelector('.app-container');
    let yesScale = 1;

    function moveButton() {
      const containerRect = appContainer.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Switch to absolute positioning for the runaway effect
      noBtn.style.position = 'absolute';
      noBtn.style.width = 'calc(100% - 48px)'; // Account for container padding
      
      const maxX = containerRect.width - btnRect.width - 48;
      const maxY = containerRect.height - btnRect.height - 48;

      const randomX = Math.max(24, Math.floor(Math.random() * maxX));
      const randomY = Math.max(24, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
      
      // Make the "Yes" button slightly bigger every time they try to click "No"
      const yesBtn = document.getElementById('yesBtn');
      yesScale += 0.05;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    function handleYes() {
      // Fire confetti
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.5 },
        colors: ['#f45b69', '#ffffff', '#ffb3ba']
      });

      // Swap views
      document.getElementById('ask-view').style.display = 'none';
      document.getElementById('details-view').style.display = 'flex';
    }
  </script>
</body>
</html>
